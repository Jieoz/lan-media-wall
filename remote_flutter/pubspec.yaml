name: remote_flutter
description: LAN Media Wall — Flutter 遥控端 (controller)。连 broker，看设备墙，下发播放控制。
publish_to: "none"
# v1.19.7+1197: 音乐 transport (next/prev + 可关闭随机, §6.3c-1) 与音频播放性能
# 修复 (setWakeMode、下一首预取、音频态缩略图退避、mpv 音频缓冲)。
# v1.19.8+1198: 控制端批量上传修复 —— Android 多选失效 (FileType.custom → audio)、
# 新增整文件夹上传、并发上传 (保序 + 单个失败不中断)、删除与「上一项/下一项」重复的
# 「上一首/下一首」按钮。
# v1.19.9+1199: 修播放端大列表缓存失败 —— 下载池 maxQueued=64 被当成业务上限,推 200 首时
# 超出的 138 首当场判 error:queue-full 且永不重试。改为溢出进 Downloader 侧 backlog
# (纯数据,不持有闭包),worker 空出即补喂;并发上限不变。
# v1.19.10+1200: 修「删歌后保存列表卡很久」—— 每次列表变更都把整个列表重新哈希一遍
# (prefetch 对每个已缓存文件做整文件 sha256),且在接收线程上、持 downloader 监视器同步跑。
# 改为:校验结果按文件身份(路径+长度+mtime)备忘,下载路径校验完直接登记;哈希移出锁;
# playlist/music_playlist 的 reclaim+prefetch 整体移出接收线程。校验强度不变。
# Rule: major*1000 + minor*10 + patch. Single-sourced here.
# v1.19.11+1201: 修 OTA "daemon:unreachable" —— 那不是 daemon 不可达,是客户端 INSTALL
# 的响应预算(4000ms)比 daemon 真实安装耗时(现场实测 3450/3521ms)只多 ~500ms,超时后把
# null 写成 "unreachable"。安装其实成功了,所以重启后新版本生效、而控制端显示 failed。
# 改:INSTALL 预算 60s;区分 TIMEOUT 与 UNREACHABLE;没回复时问 PackageManager 真实版本
# (有界轮询等 dexopt),已装上则判 late success,不再需要重启。
version: 1.19.14+1204

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  web_socket_channel: ^2.4.0
  crypto: ^3.0.3
  archive: ^4.0.9
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  qr_flutter: ^4.1.0
  # 本地媒体上传（§20 A+B）：选手机相册/文件里的图片视频。file_picker 5.x 兼容
  # 本工程 SDK 下限（Dart >=3.0 / Flutter >=3.10）；6.x+ 需更高 SDK。
  file_picker: ^5.5.0
  # 真·摄像头扫码（§15 三层入口之「扫码」）。3.5.x 是兼容本工程 SDK 下限
  # (Dart >=3.0 / Flutter >=3.10) 的最后一条线；4.x/5.x/6.x 需 Flutter 3.19+/
  # Dart 3.3+，会顶穿上面的 environment 约束。要求 Android minSdkVersion 21
  # ——由 CI 在 `flutter create` 生成 android/ 后注入（见 flutter-build.yml）。
  mobile_scanner: 3.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
